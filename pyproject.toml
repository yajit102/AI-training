[project]
name = "ai-training"
version = "0.1.0"
description = "Repository for training and fine-tuning ML models (LLM / CV / general ML)."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
